<script>

  /* =========================
     MERMAIDS AI ASSISTANT
     ========================= */

  let reservationData = {
    guests: null,
    date: null,
    time: null,
    name: null,
    phone: null,
    email: null
  };

  let reservationMode = false;


  /* =========================
     CHAT WINDOW
     ========================= */

  function openChat() {
    document.getElementById("chatWindow").classList.add("open");
    setTimeout(() => {
      document.getElementById("chatInput").focus();
    }, 100);
  }

  function closeChat() {
    document.getElementById("chatWindow").classList.remove("open");
  }


  /* =========================
     ADD MESSAGE
     ========================= */

  function addMessage(text, type) {

    const messages = document.getElementById("chatMessages");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
  }


  /* =========================
     QUICK QUESTIONS
     ========================= */

  function quickQuestion(type) {

    if (type === "menu") {

      addMessage("I'd like to see the menu.", "user");

      setTimeout(() => {

        addMessage(
          "Of course. ✨ Our menu focuses on modern Mediterranean cuisine, including seafood, meat dishes, vegetarian options and carefully selected desserts.<br><br>" +
          "Some of our signature dishes include Sea Bream Carpaccio, Grilled Octopus, Sea Bass Fillet, Truffle Risotto and Baklava Mille-Feuille.",
          "bot"
        );

      }, 400);

    }


    if (type === "reservation") {

      addMessage("I'd like to make a reservation.", "user");

      setTimeout(() => {

        reservationMode = true;

        addMessage(
          "Absolutely. ✨ I can help you with your reservation.<br><br>" +
          "Please tell me your preferred <strong>date, time and number of guests</strong>.",
          "bot"
        );

      }, 400);

    }


    if (type === "wine") {

      addMessage("Can you tell me about the wine?", "user");

      setTimeout(() => {

        addMessage(
          "Our cellar features carefully selected Greek and international wines. 🍷<br><br>" +
          "I can also help you choose a wine based on your meal. For example, I can recommend an option for seafood, meat or a vegetarian dish.",
          "bot"
        );

      }, 400);

    }


    if (type === "events") {

      addMessage("I'm interested in a private event.", "user");

      setTimeout(() => {

        addMessage(
          "Wonderful. ✨ We host birthdays, corporate dinners and private celebrations.<br><br>" +
          "Tell me the <strong>type of event, preferred date and number of guests</strong>, and I can collect the details for our team.",
          "bot"
        );

      }, 400);

    }


    if (type === "hours") {

      addMessage("What are your opening hours?", "user");

      setTimeout(() => {

        addMessage(
          "We're open <strong>Tuesday through Sunday</strong> for dinner, from <strong>18:00 until 23:30</strong>.",
          "bot"
        );

      }, 400);

    }

  }


  /* =========================
     DATE HELPERS
     ========================= */

  function getNextDayOfWeek(dayName) {

    const days = {
      "sunday": 0,
      "monday": 1,
      "tuesday": 2,
      "wednesday": 3,
      "thursday": 4,
      "friday": 5,
      "saturday": 6,

      "κυριακη": 0,
      "κυριακή": 0,
      "δευτερα": 1,
      "δευτέρα": 1,
      "τριτη": 2,
      "τρίτη": 2,
      "τεταρτη": 3,
      "τετάρτη": 3,
      "πεμπτη": 4,
      "πέμπτη": 4,
      "παρασκευη": 5,
      "παρασκευή": 5,
      "σαββατο": 6,
      "σάββατο": 6
    };

    if (!(dayName in days)) return null;

    const today = new Date();

    const targetDay = days[dayName];

    let difference = targetDay - today.getDay();

    if (difference <= 0) {
      difference += 7;
    }

    const result = new Date(today);

    result.setDate(today.getDate() + difference);

    return result.toISOString().split("T")[0];
  }


  function formatDate(dateString) {

    if (!dateString) return "";

    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  }


  /* =========================
     EXTRACT GUESTS
     ========================= */

  function extractGuests(text) {

    const match = text.match(
      /(\d+)\s*(guest|guests|people|person|άτομα|ατομο|ατόμων|persons)/i
    );

    if (match) {
      return parseInt(match[1]);
    }

    const simpleMatch = text.match(
      /\b(for|για)\s+(\d+)\b/i
    );

    if (simpleMatch) {
      return parseInt(simpleMatch[2]);
    }

    return null;
  }


  /* =========================
     EXTRACT TIME
     ========================= */

  function extractTime(text) {

    let match = text.match(
      /\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/
    );

    if (match) {

      let hour = String(match[1]).padStart(2, "0");
      let minute = match[2];

      return `${hour}:${minute}`;

    }


    match = text.match(
      /\b([1-9]|1[0-2])\s*(pm|am)\b/i
    );

    if (match) {

      let hour = parseInt(match[1]);
      const period = match[2].toLowerCase();

      if (period === "pm" && hour < 12) {
        hour += 12;
      }

      if (period === "am" && hour === 12) {
        hour = 0;
      }

      return String(hour).padStart(2, "0") + ":00";

    }


    return null;
  }


  /* =========================
     EXTRACT DATE
     ========================= */

  function extractDate(text) {

    const lower = text.toLowerCase();

    const days = [
      "sunday",
      "monday",
      "tuesday",
      "wednesday",
      "thursday",
      "friday",
      "saturday",
      "κυριακη",
      "κυριακή",
      "δευτερα",
      "δευτέρα",
      "τριτη",
      "τρίτη",
      "τεταρτη",
      "τετάρτη",
      "πεμπτη",
      "πέμπτη",
      "παρασκευη",
      "παρασκευή",
      "σαββατο",
      "σάββατο"
    ];

    for (const day of days) {

      if (lower.includes(day)) {
        return getNextDayOfWeek(day);
      }

    }


    const dateMatch = lower.match(
      /\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/
    );

    if (dateMatch) {

      let day = dateMatch[1].padStart(2, "0");
      let month = dateMatch[2].padStart(2, "0");

      let year = dateMatch[3];

      if (!year) {
        year = new Date().getFullYear();
      }

      if (year.length === 2) {
        year = "20" + year;
      }

      return `${year}-${month}-${day}`;

    }


    if (
      lower.includes("today") ||
      lower.includes("σήμερα")
    ) {

      return new Date().toISOString().split("T")[0];

    }


    if (
      lower.includes("tomorrow") ||
      lower.includes("αύριο") ||
      lower.includes("αυριο")
    ) {

      const tomorrow = new Date();

      tomorrow.setDate(tomorrow.getDate() + 1);

      return tomorrow.toISOString().split("T")[0];

    }


    return null;
  }


  /* =========================
     RESERVATION INTENT
     ========================= */

  function isReservationRequest(text) {

    const lower = text.toLowerCase();

    const keywords = [
      "reservation",
      "reserve",
      "book",
      "booking",
      "table",
      "dinner",
      "κρατ",
      "κράτ",
      "τραπεζ",
      "τραπέζ",
      "κλείσω",
      "κλεισω",
      "κλείσε",
      "κλεισε"
    ];

    return keywords.some(keyword =>
      lower.includes(keyword)
    );

  }


  /* =========================
     RESERVATION ASSISTANT
     ========================= */

  function handleReservation(text) {

    reservationMode = true;

    const guests = extractGuests(text);
    const date = extractDate(text);
    const time = extractTime(text);

    if (guests) {
      reservationData.guests = guests;
    }

    if (date) {
      reservationData.date = date;
    }

    if (time) {
      reservationData.time = time;
    }


    const missing = [];

    if (!reservationData.guests) {
      missing.push("number of guests");
    }

    if (!reservationData.date) {
      missing.push("preferred date");
    }

    if (!reservationData.time) {
      missing.push("preferred time");
    }


    if (missing.length > 0) {

      if (
        !reservationData.guests &&
        !reservationData.date &&
        !reservationData.time
      ) {

        return (
          "Absolutely. ✨ I can help you with your reservation.<br><br>" +
          "Please tell me your <strong>date, time and number of guests</strong>."
        );

      }


      if (!reservationData.guests) {

        return (
          "Perfect. ✨ What will be the <strong>number of guests</strong>?"
        );

      }


      if (!reservationData.date) {

        return (
          "Great. What <strong>date</strong> would you like to visit?"
        );

      }


      if (!reservationData.time) {

        return (
          "Perfect. What <strong>time</strong> would you prefer?"
        );

      }

    }


    return (
      "Perfect! ✨ I have your reservation details:<br><br>" +

      "👥 <strong>" +
      reservationData.guests +
      " guests</strong><br>" +

      "📅 <strong>" +
      formatDate(reservationData.date) +
      "</strong><br>" +

      "🕘 <strong>" +
      reservationData.time +
      "</strong><br><br>" +

      "To complete the reservation request, please use our reservation form below. " +
      "Our team will confirm availability with you."
    );

  }


  /* =========================
     MAIN AI RESPONSE
     ========================= */

  function sendMessage() {

    const input =
      document.getElementById("chatInput");

    const text =
      input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";


    setTimeout(() => {

      const lower = text.toLowerCase();

      let response =
        "I'd be happy to help. ✨ You can ask me about our menu, reservations, wine, opening hours, private events or dietary options.";


      /* RESERVATIONS */

      if (
        reservationMode ||
        isReservationRequest(text) ||
        extractGuests(text) ||
        extractTime(text) ||
        extractDate(text)
      ) {

        response = handleReservation(text);

      }


      /* MENU */

      else if (
        lower.includes("menu") ||
        lower.includes("food") ||
        lower.includes("eat") ||
        lower.includes("dish") ||
        lower.includes("φαγη") ||
        lower.includes("μενου") ||
        lower.includes("μενού") ||
        lower.includes("πιάτο") ||
        lower.includes("πιατο")
      ) {

        response =
          "Our menu focuses on modern Mediterranean cuisine. ✨<br><br>" +
          "You can enjoy seafood, meat dishes, vegetarian options and carefully selected desserts.<br><br>" +
          "Some signature dishes include <strong>Sea Bream Carpaccio, Grilled Octopus, Sea Bass Fillet, Truffle Risotto</strong> and <strong>Baklava Mille-Feuille</strong>.";

      }


      /* WINE */

      else if (
        lower.includes("wine") ||
        lower.includes("κρασι") ||
        lower.includes("κρασί") ||
        lower.includes("bottle") ||
        lower.includes("wine list")
      ) {

        response =
          "Our cellar features carefully selected Greek and international wines. 🍷<br><br>" +
          "If you tell me what you're planning to eat, I can suggest a wine style that would pair beautifully with your meal.";

      }


      /* EVENTS */

      else if (
        lower.includes("event") ||
        lower.includes("birthday") ||
        lower.includes("corporate") ||
        lower.includes("party") ||
        lower.includes("celebration") ||
        lower.includes("εκδηλ") ||
        lower.includes("γενεθ") ||
        lower.includes("πάρτι") ||
        lower.includes("γιορτ")
      ) {

        response =
          "We'd be delighted to help with your private event. ✨<br><br>" +
          "We host <strong>birthdays, corporate dinners and private celebrations</strong>.<br><br>" +
          "Tell me the type of event, preferred date and number of guests, and I can collect the details for our team.";

      }


      /* OPENING HOURS */

      else if (
        lower.includes("hour") ||
        lower.includes("open") ||
        lower.includes("opening") ||
        lower.includes("ωρα") ||
        lower.includes("ώρα") ||
        lower.includes("ανοιχ")
      ) {

        response =
          "Mermaids is open <strong>Tuesday through Sunday</strong> for dinner, from <strong>18:00 to 23:30</strong>.";

      }


      /* VEGETARIAN / VEGAN */

      else if (
        lower.includes("vegetarian") ||
        lower.includes("vegan") ||
        lower.includes("dietary") ||
        lower.includes("allerg") ||
        lower.includes("χορτο") ||
        lower.includes("vegan") ||
        lower.includes("αλλεργ")
      ) {

        response =
          "We offer vegetarian-friendly choices and can discuss dietary requirements with you when making a reservation. ✨<br><br>" +
          "If you tell us about your dietary requirement or allergy, our team can advise you on suitable options.";

      }


      /* GREETING */

      else if (
        lower.includes("hello") ||
        lower.includes("hi") ||
        lower.includes("hey") ||
        lower.includes("γεια") ||
        lower.includes("καλημερα") ||
        lower.includes("καλημέρα") ||
        lower.includes("καλησπερα") ||
        lower.includes("καλησπέρα")
      ) {

        response =
          "Hello and welcome to Mermaids. ✨<br><br>" +
          "I'm your virtual restaurant assistant. How can I help you today?";

      }


      /* THANK YOU */

      else if (
        lower.includes("thank") ||
        lower.includes("thanks") ||
        lower.includes("ευχαριστ")
      ) {

        response =
          "You're very welcome. ✨ We look forward to welcoming you at Mermaids.";

      }


      /* CONTACT */

      else if (
        lower.includes("contact") ||
        lower.includes("email") ||
        lower.includes("phone") ||
        lower.includes("τηλεφων") ||
        lower.includes("επικοινων")
      ) {

        response =
          "Of course. You can contact the Mermaids team through the contact details shown on our website. ✨";

      }


      addMessage(response, "bot");

    }, 500);

  }


  /* =========================
     RESERVATION FORM
     ========================= */

  document
    .getElementById("reservationForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const name =
        document.getElementById("guestName").value;

      const guests =
        document.getElementById("guests").value;

      const date =
        document.getElementById("date").value;

      const time =
        document.getElementById("time").value;


      alert(
        "Thank you, " +
        name +
        "! Your reservation request for " +
        guests +
        " on " +
        date +
        " at " +
        time +
        " has been received. Our team will contact you shortly."
      );


      this.reset();

    });


  /* =========================
     ESC KEY
     ========================= */

  document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
      closeChat();
    }

  });

</script>
