<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaids — Shop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f1e8;font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#131313;border:1px solid rgba(201,169,110,.35);padding:38px;text-align:center;box-shadow:0 20px 70px #0008}.eyebrow{font:11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#c9a96e}.logo{font-size:42px;letter-spacing:6px;margin:12px 0 6px}.sub{color:#aaa49a;margin-bottom:28px}.product{border:1px solid #292929;padding:25px;text-align:left;margin-bottom:22px}.product h2{font-weight:normal;color:#e2c995;margin:0 0 8px}.product p{color:#aaa49a;margin:0 0 15px}.price{font-size:28px;color:#f5f1e8}.button{width:100%;padding:15px 20px;border:1px solid #c9a96e;background:#c9a96e;color:#111;font:12px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}.button:hover{background:#e2c995}.note{font:11px Arial,sans-serif;color:#666;margin-top:18px}.status{min-height:20px;color:#c77d7d;font:12px Arial,sans-serif;margin-top:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Mermaids Restaurant & Wine</div>
    <div class="logo">MERMAIDS</div>
    <div class="sub">Secure online payment demo</div>

    <div class="product">
      <h2>Mermaids Signature Experience</h2>
      <p>A sample product used to demonstrate real Stripe Checkout integration.</p>
      <div class="price">€18.00</div>
    </div>

    <button class="button" id="pay">Pay securely by card</button>
    <div class="status" id="status"></div>
    <div class="note">Powered by Stripe Checkout · Test mode during development</div>
  </main>

  <script>
    const button = document.getElementById('pay');
    const status = document.getElementById('status');
    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Opening secure checkout…';
      status.textContent = '';
      try {
        const response = await fetch('/api/create-checkout-session', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({product:'Mermaids Signature Experience', amount:1800, currency:'eur'})
        });
        const data = await response.json();
        if (!response.ok || !data.url) throw new Error(data.error || 'Checkout could not be created.');
        window.location.href = data.url;
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
        button.textContent = 'Pay securely by card';
      }
    });
  </script>
</body>
</html>
