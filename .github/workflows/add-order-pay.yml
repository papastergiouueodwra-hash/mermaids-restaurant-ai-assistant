name: Add Order Pay to Mermaids site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-order-pay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Order Pay links once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = 'class="mermaids-order-pay"'
          if marker in text:
              print('Order / Pay already added.')
              raise SystemExit(0)

          nav_old = '''        <a href="#events">Private Events</a>\n        <a href="#ai" class="nav-ai">Ask Mermaids AI</a>'''
          nav_new = '''        <a href="#events">Private Events</a>\n        <a href="shop.html" class="mermaids-order-pay">Order / Pay</a>\n        <a href="#ai" class="nav-ai">Ask Mermaids AI</a>'''

          hero_old = '''        <a href="#menu" class="button">\n          Explore Menu\n        </a>'''
          hero_new = '''        <a href="#menu" class="button">\n          Explore Menu\n        </a>\n\n        <a href="shop.html" class="button mermaids-order-pay">\n          Order / Pay\n        </a>'''

          if nav_old not in text:
              raise SystemExit('Navigation anchor not found; no changes made.')
          if hero_old not in text:
              raise SystemExit('Hero button anchor not found; no changes made.')

          text = text.replace(nav_old, nav_new, 1)
          text = text.replace(hero_old, hero_new, 1)

          css_anchor = '''    .nav-ai {\n      border: 1px solid var(--gold);\n      padding: 10px 15px;\n      color: var(--gold-light);\n    }'''
          css_new = css_anchor + '''\n\n    .mermaids-order-pay {\n      border-color: var(--gold);\n    }\n\n    nav .mermaids-order-pay {\n      color: var(--gold-light);\n      padding: 10px 15px;\n      border: 1px solid var(--gold);\n    }'''

          if css_anchor not in text:
              raise SystemExit('CSS anchor not found; no changes made.')
          text = text.replace(css_anchor, css_new, 1)

          path.write_text(text, encoding='utf-8')
          print('Added Order / Pay to navigation and hero.')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Order / Pay to Mermaids site"
          git push
